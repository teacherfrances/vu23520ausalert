<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VU23520: AusAlert Revision</title>
<style>
:root{
  --navy:#12315B;
  --navy-2:#1D4A85;
  --teal:#0E7C7B;
  --teal-soft:#E4F2F1;
  --amber:#E8A33D;
  --amber-soft:#FBEFD9;
  --alert:#C1272D;
  --alert-soft:#FBE9E9;
  --paper:#F4F7FB;
  --card:#FFFFFF;
  --ink:#161B22;
  --muted:#5A6572;
  --line:#C9D3DF;
  --good:#1B7A3E;
  --good-soft:#E6F4EA;
  --bad:#B3261E;
  --bad-soft:#FBE9E7;
  --radius:14px;
}
html{font-size:20px;}
html.fs-small{font-size:18px;}
html.fs-large{font-size:23px;}
html.fs-xl{font-size:27px;}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Segoe UI",Calibri,"Trebuchet MS",system-ui,-apple-system,Arial,sans-serif;
  font-size:1rem;
  line-height:1.55;
}
.wrap{max-width:960px;margin:0 auto;padding:0 0.8rem 5rem;}

/* ---------- Header ---------- */
header.top{
  background:var(--navy);
  color:#fff;
  padding:1.4rem 0.9rem 1.6rem;
  border-bottom:6px solid var(--amber);
}
header.top .inner{max-width:960px;margin:0 auto;}
.eyebrow{
  display:inline-block;background:var(--amber);color:#3A2708;
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  font-size:.72rem;padding:.3rem .7rem;border-radius:999px;
}
h1{font-size:2rem;line-height:1.15;margin:.6rem 0 .3rem;font-weight:700;}
header.top p{margin:.2rem 0 0;color:#D5E2F2;font-size:.95rem;}

/* ---------- Text size control ---------- */
.toolbar{
  display:flex;flex-direction:column;gap:.55rem;
  background:#fff;border:2px solid var(--line);border-radius:var(--radius);
  padding:.7rem .75rem;margin:1rem 0 1.4rem;
}
.trow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;}
.trow.jump{border-top:2px solid var(--line);padding-top:.6rem;}
.jumpbtn{
  min-width:48px;min-height:48px;padding:.35rem .6rem;
  display:inline-flex;align-items:center;justify-content:center;
  border:2px solid var(--teal);border-radius:10px;background:var(--teal-soft);
  color:var(--navy);font-weight:700;text-decoration:none;font-size:1rem;
}
.jumpbtn:hover{background:var(--teal);color:#fff;}
.jumpbtn.key{background:var(--amber-soft);border-color:var(--amber);padding:.35rem .9rem;}
.jumpbtn.key:hover{background:var(--amber);color:#3A2708;}
.toolbar span.label{font-weight:700;color:var(--navy);margin-right:.2rem;font-size:.9rem;}
button{font-family:inherit;}
.sizebtn{
  min-height:48px;min-width:48px;padding:.4rem .85rem;
  border:2px solid var(--navy);background:#fff;color:var(--navy);
  border-radius:10px;font-weight:700;cursor:pointer;
}
.sizebtn[aria-pressed="true"]{background:var(--navy);color:#fff;}
.sizebtn.s1{font-size:.85rem;} .sizebtn.s2{font-size:1rem;}
.sizebtn.s3{font-size:1.2rem;} .sizebtn.s4{font-size:1.4rem;}

/* ---------- Sections ---------- */
section.act{
  scroll-margin-top:.8rem;
  background:var(--card);border:2px solid var(--line);border-left:10px solid var(--teal);
  border-radius:var(--radius);margin:0 0 1.8rem;overflow:hidden;
}
section.act > h2{
  margin:0;background:var(--teal-soft);color:var(--navy);
  padding:.9rem 1rem;font-size:1.25rem;display:flex;gap:.7rem;align-items:center;
  border-bottom:2px solid var(--line);
}
.snum{
  background:var(--navy);color:#fff;min-width:2.2rem;height:2.2rem;
  border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  font-size:1rem;flex:none;
}
.sbody{padding:1rem;}
.focus-note{
  background:var(--amber-soft);border-left:6px solid var(--amber);
  padding:.7rem .9rem;border-radius:8px;margin:0 0 1.1rem;font-size:.95rem;
}
.focus-note b{color:var(--navy);}

/* ---------- Items ---------- */
.item{padding:1rem 0;border-top:2px dashed var(--line);}
.item:first-of-type{border-top:none;padding-top:.2rem;}
.qline{display:flex;gap:.6rem;align-items:flex-start;margin-bottom:.6rem;}
.qnum{
  background:var(--amber);color:#3A2708;font-weight:700;border-radius:8px;
  min-width:2.1rem;height:2.1rem;display:inline-flex;align-items:center;justify-content:center;
  flex:none;font-size:.9rem;
}
.qtext{font-weight:600;}
.opts{display:flex;flex-direction:column;gap:.55rem;margin-left:2.7rem;}
@media(max-width:520px){.opts{margin-left:0;}}
.opt{
  display:flex;gap:.65rem;align-items:flex-start;
  min-height:48px;padding:.6rem .8rem;border:2px solid var(--line);
  border-radius:10px;background:#fff;cursor:pointer;text-align:left;width:100%;
  font-size:1rem;color:var(--ink);line-height:1.4;
}
.opt:hover{border-color:var(--navy-2);background:#F5F9FF;}
.opt .tick{
  width:1.5rem;height:1.5rem;border:2px solid var(--muted);border-radius:50%;
  flex:none;margin-top:.15rem;
}
.opt[aria-pressed="true"]{border-color:var(--navy);background:#EAF1FB;font-weight:600;}
.opt[aria-pressed="true"] .tick{background:var(--navy);border-color:var(--navy);box-shadow:inset 0 0 0 4px #fff;}
.opt.correct{border-color:var(--good);background:var(--good-soft);}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);}
.opt.showans{border-color:var(--good);border-style:dashed;}

/* two-choice rows (sort) */
.sortrow{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:space-between;
  padding:.6rem .2rem;border-top:1px solid var(--line);}
.sortrow:first-child{border-top:none;}
.sorttext{flex:1 1 14rem;font-weight:600;}
.sortbtns{display:flex;gap:.5rem;}
.sortbtn{
  min-height:48px;min-width:8.5rem;padding:.4rem .8rem;border:2px solid var(--line);
  background:#fff;border-radius:10px;font-weight:700;cursor:pointer;font-size:.95rem;color:var(--navy);
}
.sortbtn[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy);}
.sortbtn.correct{background:var(--good-soft);color:var(--good);border-color:var(--good);}
.sortbtn.wrong{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);}

/* matching */
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
@media(max-width:640px){.matchgrid{grid-template-columns:1fr;}}
.matchcol h3{margin:.2rem 0 .5rem;font-size:1rem;color:var(--navy);}
.mbtn{
  display:flex;gap:.6rem;align-items:center;width:100%;min-height:52px;
  padding:.55rem .7rem;margin-bottom:.5rem;border:2px solid var(--line);
  background:#fff;border-radius:10px;cursor:pointer;text-align:left;font-size:.98rem;
  color:var(--ink);line-height:1.35;
}
.mbtn .pin{
  min-width:1.9rem;height:1.9rem;border-radius:6px;background:#EDF1F6;color:var(--muted);
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none;
}
.mbtn.sel{border-color:var(--navy);background:#EAF1FB;}
.mbtn.paired .pin{background:var(--navy);color:#fff;}
.mbtn.correct{border-color:var(--good);background:var(--good-soft);}
.mbtn.wrong{border-color:var(--bad);background:var(--bad-soft);}

/* gap fill with word bank */
.bank{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0 1rem;padding:.7rem;
  background:#F1F5FA;border:2px dashed var(--line);border-radius:10px;}
.chip{
  min-height:48px;padding:.45rem .9rem;border:2px solid var(--navy);background:#fff;
  color:var(--navy);border-radius:999px;font-weight:700;cursor:pointer;font-size:.95rem;
}
.chip[disabled]{opacity:.35;cursor:default;}
.gapline{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;margin-left:2.7rem;}
@media(max-width:520px){.gapline{margin-left:0;}}
.blank{
  min-width:8rem;min-height:48px;padding:.35rem .7rem;border:2px solid var(--navy);
  border-bottom-width:4px;border-radius:8px;background:#fff;cursor:pointer;font-weight:700;
  color:var(--navy);font-size:1rem;
}
.blank.empty{color:var(--muted);font-weight:400;background:#FBFCFE;}
.blank.active{background:#FFF6E5;border-color:var(--amber);}
.blank.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);}
.blank.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);}

/* ordering + sentence building */
.tiles{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0;}
.tile{
  min-height:48px;padding:.5rem .85rem;border:2px solid var(--teal);background:#fff;
  color:var(--navy);border-radius:10px;font-weight:600;cursor:pointer;font-size:1rem;text-align:left;
}
.tile[disabled]{opacity:.3;cursor:default;}
.tray{
  min-height:60px;border:2px solid var(--line);border-radius:10px;background:#F8FAFD;
  padding:.6rem;display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin:.4rem 0;
}
.tray .placed{background:var(--navy);color:#fff;padding:.4rem .7rem;border-radius:8px;font-weight:600;}
.tray .placed.num{background:var(--teal);}
.tray .hint{color:var(--muted);font-style:italic;}
.tray.correct{border-color:var(--good);background:var(--good-soft);}
.tray.wrong{border-color:var(--bad);background:var(--bad-soft);}
.minibtns{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem;}
.minibtn{
  min-height:48px;padding:.4rem .9rem;border:2px solid var(--muted);background:#fff;color:var(--navy);
  border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;
}

/* typing */
.typebox{
  width:100%;max-width:30rem;min-height:52px;padding:.5rem .7rem;font-family:inherit;font-size:1rem;
  border:2px solid var(--navy);border-radius:10px;margin-left:2.7rem;
}
@media(max-width:520px){.typebox{margin-left:0;}}
.typebox.correct{border-color:var(--good);background:var(--good-soft);}
.typebox.wrong{border-color:var(--bad);background:var(--bad-soft);}

/* feedback + section footer */
.fb{margin-left:2.7rem;margin-top:.5rem;font-weight:700;display:none;}
@media(max-width:520px){.fb{margin-left:0;}}
.fb.show{display:block;}
.fb.ok{color:var(--good);}
.fb.no{color:var(--bad);}
.fb .ans{display:block;font-weight:600;color:var(--navy);margin-top:.2rem;}
.sfoot{
  display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;
  padding:1rem;background:#F1F5FA;border-top:2px solid var(--line);
}
.bigbtn{
  min-height:52px;padding:.6rem 1.2rem;border-radius:10px;border:2px solid var(--navy);
  background:var(--navy);color:#fff;font-weight:700;font-size:1rem;cursor:pointer;
}
.bigbtn.ghost{background:#fff;color:var(--navy);}
.bigbtn.amber{background:var(--amber);border-color:var(--amber);color:#3A2708;}
.score{font-weight:700;color:var(--navy);}
.keybox{
  display:none;margin:0 1rem 1rem;padding:.9rem 1rem;background:var(--amber-soft);
  border:2px solid var(--amber);border-radius:10px;
}
.keybox.show{display:block;}
.keybox h3{margin:.1rem 0 .5rem;font-size:1.05rem;color:var(--navy);}
.keybox ol{margin:0;padding-left:1.6rem;}
.keybox li{margin:.25rem 0;}

/* ---------- Phone demo ---------- */
.demo-stage{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:1.2rem;align-items:start;}
@media(max-width:720px){.demo-stage{grid-template-columns:1fr;}}
.phone{
  background:#0B1B33;border-radius:32px;padding:.9rem .7rem 1.4rem;
  border:4px solid #0B1B33;box-shadow:0 10px 26px rgba(12,30,60,.35);margin:0 auto;width:100%;
}
.phone .notch{width:38%;height:.7rem;background:#000;border-radius:999px;margin:0 auto .6rem;}
.screen{
  background:#0F1F3A;border-radius:20px;min-height:24rem;padding:.8rem;
  display:flex;flex-direction:column;gap:.7rem;position:relative;overflow:hidden;
}
.screen .time{color:#C7D6EC;text-align:center;font-size:1.6rem;font-weight:300;letter-spacing:.02em;}
.screen .date{color:#8FA6C6;text-align:center;font-size:.8rem;margin-top:-.5rem;}
.screen .idle{color:#7C93B4;text-align:center;font-size:.85rem;margin-top:auto;padding-bottom:.6rem;}
.alertcard{
  background:#fff;border-radius:14px;overflow:hidden;display:none;
  box-shadow:0 6px 18px rgba(0,0,0,.35);
}
.alertcard.show{display:block;}
.alertcard .ahead{
  background:var(--alert);color:#fff;padding:.55rem .7rem;font-weight:700;
  display:flex;gap:.5rem;align-items:center;font-size:.9rem;
}
.alertcard .ahead .bang{
  background:#fff;color:var(--alert);width:1.6rem;height:1.6rem;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;font-weight:900;flex:none;
}
.alertcard .abody{padding:.7rem .8rem .9rem;font-size:.92rem;color:#1A1A1A;line-height:1.5;}
.alertcard .abody .stamp{color:#5A6572;font-size:.78rem;margin-bottom:.5rem;}
.alertcard .abody p{margin:.5rem 0;}
.alertcard .abody .kicker{font-weight:700;color:var(--alert);}
.aline{opacity:0;transform:translateY(6px);transition:opacity .45s ease, transform .45s ease;}
.aline.in{opacity:1;transform:none;}
.buzz{animation:buzz .5s linear 0s 6;}
@keyframes buzz{
  0%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}
  60%{transform:translateX(-3px)}80%{transform:translateX(3px)}100%{transform:translateX(0)}
}
.soundwave{display:flex;gap:.25rem;align-items:flex-end;height:1.6rem;justify-content:center;}
.soundwave i{width:.35rem;background:var(--amber);border-radius:3px;height:.4rem;display:block;}
.soundwave.on i{animation:wv .6s ease-in-out infinite alternate;}
.soundwave.on i:nth-child(2){animation-delay:.1s}
.soundwave.on i:nth-child(3){animation-delay:.2s}
.soundwave.on i:nth-child(4){animation-delay:.3s}
.soundwave.on i:nth-child(5){animation-delay:.15s}
@keyframes wv{from{height:.4rem}to{height:1.5rem}}
.demo-controls{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.9rem;}
.transcript{
  background:#F8FAFD;border:2px solid var(--line);border-radius:12px;padding:.9rem 1rem;
}
.transcript h3{margin:.1rem 0 .5rem;color:var(--navy);font-size:1.05rem;}
.transcript p{margin:.45rem 0;}
.transcript .msg{background:#fff;border-left:6px solid var(--alert);padding:.6rem .8rem;border-radius:8px;}
.warnline{font-size:.85rem;color:var(--muted);margin:.2rem 0 .8rem;}

/* ---------- Final key ---------- */
.finalkey{background:#fff;border:2px solid var(--navy);border-radius:var(--radius);padding:1rem;}
.finalkey h2{margin:.1rem 0 .8rem;color:var(--navy);}
.finalkey h3{color:var(--teal);margin:1.1rem 0 .3rem;font-size:1.05rem;}
.finalkey ol{padding-left:1.6rem;margin:.2rem 0;}
.keywrap{display:none;}
.keywrap.show{display:block;}
.result{
  background:var(--navy);color:#fff;border-radius:var(--radius);padding:1.1rem;margin-bottom:1.2rem;
  display:none;
}
.result.show{display:block;}
.result .big{font-size:2.2rem;font-weight:700;line-height:1.1;}
.result .bar{background:#28456F;border-radius:999px;height:1rem;overflow:hidden;margin:.7rem 0 .4rem;}
.result .bar i{display:block;height:100%;background:var(--amber);width:0;transition:width .8s ease;}


:focus-visible{outline:4px solid var(--amber);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
  .aline{opacity:1;transform:none;}
}
@media print{
  .toolbar,.sfoot,.demo-controls{display:none !important;}
  section.act{break-inside:avoid;}
  .keybox,.keywrap{display:block !important;}
}
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <span class="eyebrow">VU23520 &middot; EAL 2</span>
    <h1>AusAlert Revision</h1>
    <p>Give and respond to simple spoken information and directions</p>
  </div>
</header>

<div class="wrap">

  <div class="toolbar">
    <div class="trow">
      <span class="label">Text size</span>
      <button class="sizebtn s1" data-size="fs-small" aria-pressed="false">A</button>
      <button class="sizebtn s2" data-size="" aria-pressed="true">A</button>
      <button class="sizebtn s3" data-size="fs-large" aria-pressed="false">A</button>
      <button class="sizebtn s4" data-size="fs-xl" aria-pressed="false">A</button>
    </div>
    <div class="trow jump">
      <span class="label">Go to</span>
      <a class="jumpbtn" href="#s1">1</a>
      <a class="jumpbtn" href="#s2">2</a>
      <a class="jumpbtn" href="#s3">3</a>
      <a class="jumpbtn" href="#s4">4</a>
      <a class="jumpbtn" href="#s5">5</a>
      <a class="jumpbtn" href="#s6">6</a>
      <a class="jumpbtn" href="#s7">7</a>
      <a class="jumpbtn" href="#s8">8</a>
      <a class="jumpbtn key" href="#fullkey">Key</a>
    </div>
  </div>


  <div id="sections"></div>

  <div class="result" id="result">
    <div>Your total score</div>
    <div class="big"><span id="rScore">0</span> out of <span id="rTotal">0</span></div>
    <div class="bar"><i id="rBar"></i></div>
    <div id="rMsg"></div>
  </div>

  <section class="act" id="fullkey">
    <h2><span class="snum">K</span> Full answer key</h2>
    <div class="sbody">
      <p>Use this after you finish. It shows every answer in this activity.</p>
      <div class="minibtns">
        <button class="bigbtn amber" id="checkAll">Check all my answers</button>
        <button class="bigbtn ghost" id="showAll">Show the full answer key</button>
        <button class="bigbtn ghost" id="resetAll">Start again</button>
      </div>
      <div class="keywrap" id="keywrap"><div class="finalkey" id="finalkey"></div></div>
    </div>
  </section>

</div>

<script>
"use strict";

/* =========================================================
   DATA
   ========================================================= */
var DEMO_LINES = [
  {cls:"kicker", t:"AUSALERT: TEST MESSAGE"},
  {cls:"", t:"This is a test of AUSALERT, the new warning system."},
  {cls:"", t:"This is only a test. There is no danger."},
  {cls:"", t:"You do not need to do anything."},
  {cls:"", t:"In a real emergency, this message tells you about danger in your area and what to do."}
];

var SECTIONS = [
{
  id:"s1", num:"1", title:"Live AUSALERT demo and comprehension",
  focus:"Tap Play the alert. Listen to the loud sound and read the message on the phone. Then answer the questions. You can play it again as many times as you like.",
  demo:true,
  items:[
    {type:"mc", q:"What kind of message is this?", o:["A real emergency","A test message","A message from a friend"], a:1},
    {type:"mc", q:"When did the message come?", o:["Monday 27 July at 2pm","Monday 27 June at 2am","Sunday 27 July at 12pm"], a:0},
    {type:"mc", q:"Is there danger?", o:["Yes, there is a fire","Yes, there is a flood","No, there is no danger"], a:2},
    {type:"mc", q:"What do you need to do after this message?", o:["Nothing","Go outside","Ring your family"], a:0},
    {type:"mc", q:"What did the phone do when the message came?", o:["It made a loud sound","It turned off","It sent a message back"], a:0},
    {type:"mc", q:"What does the screen say?", o:["DANGER","TEST MESSAGE","CALL 000"], a:1},
    {type:"tf", q:"AUSALERT is a new warning system.", a:true},
    {type:"tf", q:"In a real emergency, the message tells you about danger in your area.", a:true}
  ]
},
{
  id:"s2", num:"2", title:"Key words",
  focus:"Match each word with its meaning. Tap a word on the left, then tap its meaning on the right.",
  items:[
    {type:"match", pairs:[
      ["alert","a message that tells you something is wrong"],
      ["warning","information that tells you to be careful"],
      ["danger","something that can hurt you"],
      ["emergency","a very serious problem, you need help fast"],
      ["message","words you send or get on your phone"],
      ["mobile","a phone you carry with you"],
      ["test","when you try something to see if it works"],
      ["system","a way of doing something, it has many parts"],
      ["area","the part of the city or town where you live"]
    ]}
  ]
},
{
  id:"s3", num:"3", title:"Instruction phrases",
  focus:"AUSALERT gives you short instructions. Tap a gap, then tap the word that goes in it.",
  items:[
    {type:"gapset",
     bank:["Stay","Move","Listen","Check","Follow","Do"],
     lines:[
       {pre:"", post:" inside. Do not go outside.", a:"Stay"},
       {pre:"", post:" away from the danger.", a:"Move"},
       {pre:"", post:" carefully. Do not miss important words.", a:"Listen"},
       {pre:"", post:" your phone for new messages.", a:"Check"},
       {pre:"", post:" the instructions in the message.", a:"Follow"},
       {pre:"", post:" not panic. Stay calm.", a:"Do"}
     ]},
    {type:"mc", q:"\u201cMove away\u201d means:", o:["Go away from the danger","Stay near the danger","Move your furniture"], a:0},
    {type:"mc", q:"\u201cDo not panic\u201d means:", o:["Be very afraid","Stay calm","Run fast"], a:1},
    {type:"mc", q:"\u201cCheck your phone\u201d means:", o:["Turn your phone off","Buy a new phone","Look at your phone for new messages"], a:2}
  ]
},
{
  id:"s4", num:"4", title:"Grammar: giving instructions",
  focus:"An instruction begins with the verb: Stay inside. A negative instruction is Do not + simple verb: Do not panic. A polite instruction is Please + verb, or Can you or Could you + verb ..., please?",
  items:[

/* =========================================================
   HELPERS
   ========================================================= */
function el(tag, cls, txt){var e=document.createElement(tag); if(cls)e.className=cls; if(txt!==undefined)e.textContent=txt; return e;}
function shuffle(arr){var a=arr.slice(),i,j,t; for(i=a.length-1;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;} return a;}
function norm(s){return String(s).toLowerCase().replace(/[\u2019']/g,"'").replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();}

var REG = [];   /* every scored item */
var SECMAP = {};

/* =========================================================
   RENDERING
   ========================================================= */
function qHead(n, text){
  var line = el("div","qline");
  line.appendChild(el("span","qnum", n));
  line.appendChild(el("div","qtext", text));
  return line;
}
function feedbackNode(){ var f = el("div","fb"); return f; }
function markFb(f, ok, ansText){
  f.className = "fb show " + (ok ? "ok" : "no");
  f.textContent = ok ? "Correct" : "Not correct";
  if(!ok && ansText){ var s = el("span","ans","Answer: " + ansText); f.appendChild(s); }
}

function renderMC(item, n, sec){
  var box = el("div","item");
  box.appendChild(qHead(n, item.q));
  var opts = el("div","opts");
  var chosen = -1; var btns=[];
  item.o.forEach(function(txt,i){
    var b = el("button","opt"); b.type="button"; b.setAttribute("aria-pressed","false");
    b.appendChild(el("span","tick"));
    b.appendChild(el("span","",txt));
    b.addEventListener("click",function(){
      chosen=i;
      btns.forEach(function(x,k){x.setAttribute("aria-pressed", k===i?"true":"false");});
    });
    btns.push(b); opts.appendChild(b);
  });
  box.appendChild(opts);
  var f = feedbackNode(); box.appendChild(f);
  REG.push({sec:sec, n:n, ans:item.o[item.a],
    answered:function(){return chosen>-1;},
    check:function(){
      var ok = chosen===item.a;
      btns.forEach(function(x,k){
        x.classList.remove("correct","wrong","showans");
        if(k===item.a) x.classList.add("correct");
        if(k===chosen && !ok) x.classList.add("wrong");
      });
      markFb(f, ok, item.o[item.a]);
      return ok;
    },
    reveal:function(){ btns[item.a].classList.add("showans"); },
    reset:function(){ chosen=-1; f.className="fb"; btns.forEach(function(x){x.setAttribute("aria-pressed","false");x.classList.remove("correct","wrong","showans");}); }
  });
  return box;
}

function renderTF(item, n, sec){
  var box = el("div","item");
  box.appendChild(qHead(n, item.q));
  var row = el("div","sortbtns"); row.style.marginLeft="2.7rem";
  var chosen=null; var btns=[];
  [["True",true],["False",false]].forEach(function(p){
    var b=el("button","sortbtn",p[0]); b.type="button"; b.setAttribute("aria-pressed","false");
    b.addEventListener("click",function(){
      chosen=p[1];
      btns.forEach(function(x){x.setAttribute("aria-pressed", x===b?"true":"false");});
    });
    btns.push(b); row.appendChild(b);
  });
  box.appendChild(row);
  var f = feedbackNode(); box.appendChild(f);
  var ansText = (item.a?"True":"False") + (item.note? " (" + item.note + ")" : "");
  REG.push({sec:sec, n:n, ans:ansText,
    answered:function(){return chosen!==null;},
    check:function(){
      var ok = chosen===item.a;
      btns.forEach(function(x,k){
        x.classList.remove("correct","wrong");
        var val = (k===0);
        if(val===item.a) x.classList.add("correct");
        if(chosen!==null && val===chosen && !ok) x.classList.add("wrong");
      });
      markFb(f, ok, ansText);
      return ok;
    },
    reveal:function(){ btns[item.a?0:1].classList.add("correct"); },
    reset:function(){ chosen=null; f.className="fb"; btns.forEach(function(x){x.setAttribute("aria-pressed","false");x.classList.remove("correct","wrong");}); }
  });
  return box;
}

function renderMatch(item, start, sec){
  var box = el("div","item");
  box.appendChild(qHead(start + " to " + (start+item.pairs.length-1), "Match the word with its meaning."));
  var grid = el("div","matchgrid");
  var left = el("div","matchcol"); left.appendChild(el("h3",null,"Word"));
  var right = el("div","matchcol"); right.appendChild(el("h3",null,"Meaning"));
  var order = shuffle(item.pairs.map(function(p,i){return i;}));
  var lBtns=[], rBtns=[], assign={}, sel=null;

  function paint(){
    lBtns.forEach(function(b,i){
      var v = assign[i];
      b.classList.toggle("paired", v!==undefined);
      b.querySelector(".pin").textContent = v===undefined ? "?" : String(i+1);
      b.classList.toggle("sel", sel===i);
    });
    rBtns.forEach(function(b,j){
      var owner = null;
      for(var k in assign){ if(assign[k]===j) owner=Number(k); }
      b.classList.toggle("paired", owner!==null);
      b.querySelector(".pin").textContent = owner===null ? "?" : String(owner+1);
    });
  }
  item.pairs.forEach(function(p,i){
    var b=el("button","mbtn"); b.type="button";
    b.appendChild(el("span","pin","?")); b.appendChild(el("span","",p[0]));
    b.addEventListener("click",function(){ sel = (sel===i? null : i); paint(); });
    lBtns.push(b); left.appendChild(b);
  });
  order.forEach(function(origIdx,j){
    var b=el("button","mbtn"); b.type="button";
    b.appendChild(el("span","pin","?")); b.appendChild(el("span","",item.pairs[origIdx][1]));
    b.dataset.orig = origIdx;
    b.addEventListener("click",function(){
      if(sel===null){ return; }
      for(var k in assign){ if(assign[k]===j) delete assign[k]; }
      assign[sel]=j; sel=null; paint();
    });
    rBtns.push(b); right.appendChild(b);
  });
  grid.appendChild(left); grid.appendChild(right);
  box.appendChild(grid);
  var mb = el("div","minibtns");
  var clr = el("button","minibtn","Clear all"); clr.type="button";
  clr.addEventListener("click",function(){ assign={}; sel=null;
    lBtns.concat(rBtns).forEach(function(b){b.classList.remove("correct","wrong");}); paint(); });
  mb.appendChild(clr); box.appendChild(mb);

  item.pairs.forEach(function(p,i){
    REG.push({sec:sec, n:start+i, ans:p[0] + " = " + p[1],
      answered:function(){return assign[i]!==undefined;},
      check:function(){
        var j = assign[i];
        var ok = (j!==undefined) && Number(rBtns[j].dataset.orig)===i;
        lBtns[i].classList.remove("correct","wrong");
        lBtns[i].classList.add(ok?"correct":"wrong");
        if(j!==undefined){ rBtns[j].classList.remove("correct","wrong"); rBtns[j].classList.add(ok?"correct":"wrong"); }
        return ok;
      },
      reveal:function(){},
      reset:function(){ assign={}; sel=null; lBtns.concat(rBtns).forEach(function(b){b.classList.remove("correct","wrong");}); paint(); }
    });
  });
  paint();
  return box;
}

function renderGapset(item, start, sec){
  var box = el("div","item");
  box.appendChild(qHead(start + " to " + (start+item.lines.length-1), "Tap a gap, then tap a word from the box."));
  var bank = el("div","bank");
  var chips = {};
  shuffle(item.bank).forEach(function(w){
    var c = el("button","chip",w); c.type="button"; c.dataset.word=w;
    chips[w]=c; bank.appendChild(c);
  });
  box.appendChild(bank);
  var active = null; var vals = {};
  function repaintChips(){
    var used = {};
    for(var k in vals){ if(vals[k]) used[vals[k]]=true; }
    for(var w in chips){ chips[w].disabled = !!used[w]; }
  }
  item.lines.forEach(function(ln,i){
    var row = el("div","gapline"); row.style.marginBottom=".55rem";
    row.appendChild(el("span","",(i+1)+". " + ln.pre));
    var b = el("button","blank empty","(tap here)"); b.type="button";
    b.addEventListener("click",function(){
      if(vals[i]){ vals[i]=null; b.textContent="(tap here)"; b.classList.add("empty"); b.classList.remove("correct","wrong"); repaintChips(); return; }
      active = i;
      box.querySelectorAll(".blank").forEach(function(x){x.classList.remove("active");});
      b.classList.add("active");
    });
    ln._btn = b;
    row.appendChild(b);
    row.appendChild(el("span","",ln.post));
    box.appendChild(row);
  });
  Object.keys(chips).forEach(function(w){
    chips[w].addEventListener("click",function(){
      if(active===null){ active = item.lines.findIndex(function(l,i){return !vals[i];}); if(active<0) return; }
      vals[active]=w;
      var b = item.lines[active]._btn;
      b.textContent=w; b.classList.remove("empty","active","correct","wrong");
      active=null; repaintChips();
    });
  });
  var mb = el("div","minibtns");
  var clr = el("button","minibtn","Clear all"); clr.type="button";
  clr.addEventListener("click",function(){
    vals={}; active=null;
    item.lines.forEach(function(l){ l._btn.textContent="(tap here)"; l._btn.className="blank empty"; });
    repaintChips();
  });
  mb.appendChild(clr); box.appendChild(mb);

  item.lines.forEach(function(ln,i){
    REG.push({sec:sec, n:start+i, ans:ln.a + ln.post,
      answered:function(){return !!vals[i];},
      check:function(){
        var ok = vals[i]===ln.a;
        ln._btn.classList.remove("correct","wrong","active");
        ln._btn.classList.add(ok?"correct":"wrong");
        return ok;
      },
      reveal:function(){},
      reset:function(){ vals[i]=null; ln._btn.textContent="(tap here)"; ln._btn.className="blank empty"; repaintChips(); }
    });
  });
  return box;
}

function renderOrder(item, start, sec){
  var box = el("div","item");
  box.appendChild(qHead(start + " to " + (start+item.correct.length-1), item.instr));
  var tray = el("div","tray"); tray.appendChild(el("span","hint","Your order will appear here."));
  var tiles = el("div","tiles");
  var placed = []; var tileBtns=[];
  function paint(){
    tray.innerHTML="";
    if(placed.length===0){ tray.appendChild(el("span","hint","Your order will appear here.")); }
    placed.forEach(function(txt,i){ tray.appendChild(el("span","placed num",(i+1)+". "+txt)); });
    tileBtns.forEach(function(b){ b.disabled = placed.indexOf(b.dataset.txt)>-1; });
  }
  shuffle(item.correct).forEach(function(txt){
    var b=el("button","tile",txt); b.type="button"; b.dataset.txt=txt;
    b.addEventListener("click",function(){ if(placed.length<item.correct.length){ placed.push(txt); tray.classList.remove("correct","wrong"); paint(); } });
    tileBtns.push(b); tiles.appendChild(b);
  });
  box.appendChild(tiles);
  var mb=el("div","minibtns");
  var undo=el("button","minibtn","Undo last"); undo.type="button";
  undo.addEventListener("click",function(){ placed.pop(); tray.classList.remove("correct","wrong"); paint(); });
  var clr=el("button","minibtn","Clear"); clr.type="button";
  clr.addEventListener("click",function(){ placed=[]; tray.classList.remove("correct","wrong"); paint(); });
  mb.appendChild(undo); mb.appendChild(clr);
  box.appendChild(mb); box.appendChild(tray);
  paint();
  item.correct.forEach(function(txt,i){
    REG.push({sec:sec, n:start+i, ans:(i+1)+". "+txt,
      answered:function(){return placed.length>i;},
      check:function(){
        var ok = placed[i]===txt;
        if(i===0){ tray.classList.remove("correct","wrong"); }
        if(!ok){ tray.classList.add("wrong"); tray.classList.remove("correct"); }
        else if(!tray.classList.contains("wrong")){ tray.classList.add("correct"); }
        return ok;
      },
      reveal:function(){},
      reset:function(){ placed=[]; tray.classList.remove("correct","wrong"); paint(); }
    });
  });
  return box;
}

function renderBuild(item, n, sec){
  var box = el("div","item");
  box.appendChild(qHead(n, "Build the sentence."));
  var tray = el("div","tray");
  var tiles = el("div","tiles");
  var placed=[]; var tileBtns=[];
  function paint(){
    tray.innerHTML="";
    if(placed.length===0){ tray.appendChild(el("span","hint","Your sentence will appear here.")); }
    placed.forEach(function(t){ tray.appendChild(el("span","placed",t)); });
    var counts={};
    placed.forEach(function(t){counts[t]=(counts[t]||0)+1;});
    var seen={};
    tileBtns.forEach(function(b){
      var w=b.dataset.txt; seen[w]=(seen[w]||0)+1;
      b.disabled = (counts[w]||0) >= seen[w];
    });
  }
  shuffle(item.seq).forEach(function(w){
    var b=el("button","tile",w); b.type="button"; b.dataset.txt=w;
    b.addEventListener("click",function(){ placed.push(w); tray.classList.remove("correct","wrong"); paint(); });
    tileBtns.push(b); tiles.appendChild(b);
  });
  box.appendChild(tiles);
  var mb=el("div","minibtns");
  var undo=el("button","minibtn","Undo last"); undo.type="button";
  undo.addEventListener("click",function(){ placed.pop(); tray.classList.remove("correct","wrong"); paint(); });
  var clr=el("button","minibtn","Clear"); clr.type="button";
  clr.addEventListener("click",function(){ placed=[]; tray.classList.remove("correct","wrong"); paint(); });
  mb.appendChild(undo); mb.appendChild(clr);
  box.appendChild(mb); box.appendChild(tray);
  var f=feedbackNode(); f.style.marginLeft="0"; box.appendChild(f);
  paint();
  var pretty = item.seq.join(" ");
  REG.push({sec:sec, n:n, ans:pretty,
    answered:function(){return placed.length>0;},
    check:function(){
      var ok = placed.join(" ")===item.seq.join(" ");
      tray.classList.remove("correct","wrong"); tray.classList.add(ok?"correct":"wrong");
      markFb(f, ok, pretty);
      return ok;
    },
    reveal:function(){},
    reset:function(){ placed=[]; tray.classList.remove("correct","wrong"); f.className="fb"; paint(); }
  });
  return box;
}

function renderSort(item, start, sec){
  var box = el("div","item");
  box.appendChild(qHead(start + " to " + (start+item.rows.length-1), item.instr));
  var wrap = el("div","");
  var states=[];
  item.rows.forEach(function(r,i){
    var row=el("div","sortrow");
    row.appendChild(el("div","sorttext",r.t));
    var bts=el("div","sortbtns");
    var a=el("button","sortbtn",item.catA); a.type="button"; a.setAttribute("aria-pressed","false");
    var b=el("button","sortbtn",item.catB); b.type="button"; b.setAttribute("aria-pressed","false");
    a.addEventListener("click",function(){states[i]="A";a.setAttribute("aria-pressed","true");b.setAttribute("aria-pressed","false");});
    b.addEventListener("click",function(){states[i]="B";b.setAttribute("aria-pressed","true");a.setAttribute("aria-pressed","false");});
    bts.appendChild(a); bts.appendChild(b); row.appendChild(bts); wrap.appendChild(row);
    r._a=a; r._b=b;
  });
  box.appendChild(wrap);
  item.rows.forEach(function(r,i){
    REG.push({sec:sec, n:start+i, ans:r.t + " = " + (r.a==="A"?item.catA:item.catB),
      answered:function(){return !!states[i];},
      check:function(){
        var ok = states[i]===r.a;
        r._a.classList.remove("correct","wrong"); r._b.classList.remove("correct","wrong");
        (r.a==="A"?r._a:r._b).classList.add("correct");
        if(!ok && states[i]){ (states[i]==="A"?r._a:r._b).classList.add("wrong"); }
        return ok;
      },
      reveal:function(){ (r.a==="A"?r._a:r._b).classList.add("correct"); },
      reset:function(){ states[i]=null; [r._a,r._b].forEach(function(x){x.setAttribute("aria-pressed","false");x.classList.remove("correct","wrong");}); }
    });
  });
  return box;
}

function renderType(item, n, sec){
  var box = el("div","item");
  box.appendChild(qHead(n, item.q));
  var inp = document.createElement("input");
  inp.type="text"; inp.className="typebox"; inp.placeholder = item.hint || "Write your answer here";
  box.appendChild(inp);
  var f=feedbackNode(); box.appendChild(f);
  REG.push({sec:sec, n:n, ans:item.show,
    answered:function(){return inp.value.trim().length>0;},
    check:function(){
      var v=norm(inp.value);
      var ok = item.accept.some(function(a){return norm(a)===v;});
      inp.classList.remove("correct","wrong"); inp.classList.add(ok?"correct":"wrong");
      markFb(f, ok, item.show);
      return ok;
    },
    reveal:function(){},
    reset:function(){ inp.value=""; inp.classList.remove("correct","wrong"); f.className="fb"; }
  });
  return box;
}

function renderListen(item, n, sec){

  var mb=el("div","minibtns"); mb.style.marginLeft="2.7rem";
  var play=el("button","bigbtn amber","Play the sentence"); play.type="button";
  play.addEventListener("click",function(){ speak(item.say); });
  var show=el("button","minibtn","Show the words"); show.type="button";
  var txt=el("div","", ""); txt.style.marginLeft="2.7rem"; txt.style.fontStyle="italic"; txt.style.color="#5A6572";
  show.addEventListener("click",function(){ txt.textContent = txt.textContent ? "" : "\u201c" + item.say + "\u201d"; });
  mb.appendChild(play); mb.appendChild(show);
  box.appendChild(mb); box.appendChild(txt);
  var opts=el("div","opts"); var chosen=-1; var btns=[];
  item.o.forEach(function(t,i){
    var b=el("button","opt"); b.type="button"; b.setAttribute("aria-pressed","false");
    b.appendChild(el("span","tick")); b.appendChild(el("span","",t));
    b.addEventListener("click",function(){ chosen=i; btns.forEach(function(x,k){x.setAttribute("aria-pressed",k===i?"true":"false");}); });
    btns.push(b); opts.appendChild(b);
  });
  box.appendChild(opts);
  var f=feedbackNode(); box.appendChild(f);
  REG.push({sec:sec, n:n, ans:item.o[item.a],
    answered:function(){return chosen>-1;},
    check:function(){
      var ok=chosen===item.a;
      btns.forEach(function(x,k){ x.classList.remove("correct","wrong");
        if(k===item.a)x.classList.add("correct");
        if(k===chosen && !ok)x.classList.add("wrong"); });
      markFb(f, ok, item.o[item.a]);
      return ok;
    },
    reveal:function(){ btns[item.a].classList.add("showans"); },
    reset:function(){ chosen=-1; f.className="fb"; btns.forEach(function(x){x.setAttribute("aria-pressed","false");x.classList.remove("correct","wrong","showans");}); }
  });
  return box;
}

/* =========================================================
   SOUND: alert tone + speech
   ========================================================= */
var audioCtx = null;
function getCtx(){
  if(!audioCtx){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    audioCtx = new AC();
  }
  if(audioCtx.state === "suspended"){ audioCtx.resume(); }
  return audioCtx;
}
var soundOn = true;
function playAlertTone(){
  if(!soundOn) return 0;
  var ctx = getCtx();
  if(!ctx) return 0;
  var t0 = ctx.currentTime + 0.05;
  var dur = 3.2;
  var master = ctx.createGain();
  master.gain.setValueAtTime(0.0001, t0);
  master.gain.exponentialRampToValueAtTime(0.16, t0 + 0.05);
  master.gain.setValueAtTime(0.16, t0 + dur - 0.1);
  master.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  master.connect(ctx.destination);
  var osc = ctx.createOscillator();
  osc.type = "square";
  var step = 0.22, freqs = [853, 960];
  for(var i=0; i*step < dur; i++){
    osc.frequency.setValueAtTime(freqs[i % 2], t0 + i*step);
  }
  var osc2 = ctx.createOscillator();
  osc2.type = "sine";
  for(var j=0; j*step < dur; j++){
    osc2.frequency.setValueAtTime(freqs[(j+1) % 2] * 2, t0 + j*step);
  }
  var g2 = ctx.createGain(); g2.gain.value = 0.35; g2.connect(master);
  osc.connect(master); osc2.connect(g2);
  osc.start(t0); osc2.start(t0);
  osc.stop(t0 + dur); osc2.stop(t0 + dur);
  if(navigator.vibrate){ navigator.vibrate([600,180,600,180,900]); }
  return dur;
}
function stopSound(){
  if(audioCtx){ try{ audioCtx.close(); }catch(e){} audioCtx = null; }
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  if(navigator.vibrate) navigator.vibrate(0);
}
var voices = [];
var voiceNotes = [];
function loadVoices(){
  if(window.speechSynthesis){ voices = window.speechSynthesis.getVoices() || []; }
  return voices;
}
/* Australian English first. Named Australian voices are checked before the
   generic en-AU list, then any voice whose name mentions Australia. */
var AU_NAMES = /karen|catherine|nicole|russell|lee|australia|australian|en-au/i;
function pickAuVoice(){
  loadVoices();
  var au = voices.filter(function(v){
    var lg = (v.lang || "").toLowerCase().replace("_","-");
    return lg.indexOf("en-au") === 0;
  });
  if(au.length){
    var named = au.filter(function(v){ return AU_NAMES.test(v.name || ""); });
    return named[0] || au[0];
  }
  var byName = voices.filter(function(v){ return /austral/i.test(v.name || ""); });
  if(byName.length) return byName[0];
  return null;
}
function fallbackVoice(){
  loadVoices();
  return voices.filter(function(v){
    var lg = (v.lang || "").toLowerCase().replace("_","-");
    return lg.indexOf("en-gb") === 0;
  })[0] || voices.filter(function(v){
    return (v.lang || "").toLowerCase().indexOf("en") === 0;
  })[0] || null;
}
function refreshVoiceNotes(){
  var au = pickAuVoice();
  voiceNotes.forEach(function(n){
    if(au){
      n.textContent = "Australian voice: " + au.name;
      n.style.color = "#0E7C7B";
    } else if(voices.length){
      n.textContent = "This device has no Australian English voice, so the recording will use another English voice. On Windows, add English (Australia) in Settings, Time and language, Speech.";
      n.style.color = "#B3261E";
    } else {
      n.textContent = "";
    }
  });
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = function(){ loadVoices(); refreshVoiceNotes(); };
}
function makeVoiceNote(){
  var n = el("div","warnline",""); n.style.marginTop=".4rem";
  voiceNotes.push(n);
  return n;
}
function speak(text){
  if(!window.speechSynthesis) return false;
  var go = function(){
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "en-AU";
    u.rate = 0.82;
    u.pitch = 1;
    var v = pickAuVoice() || fallbackVoice();
    if(v){ u.voice = v; u.lang = v.lang || "en-AU"; }
    window.speechSynthesis.speak(u);
    refreshVoiceNotes();
  };
  loadVoices();
  if(!voices.length){ setTimeout(function(){ loadVoices(); go(); }, 300); }
  else { go(); }
  return true;
}

/* =========================================================
   DEMO
   ========================================================= */
function buildDemo(){
  var wrap = el("div","");
  var stage = el("div","demo-stage");

  var phoneWrap = el("div","");
  var phone = el("div","phone");
  phone.appendChild(el("div","notch"));
  var screen = el("div","screen");
  var time = el("div","time","2:00 pm");
  var date = el("div","date","Monday 27 July");
  var wave = el("div","soundwave");
  for(var i=0;i<5;i++){ wave.appendChild(document.createElement("i")); }
  var card = el("div","alertcard");
  var head = el("div","ahead");
  head.appendChild(el("span","bang","!"));
  head.appendChild(el("span","","Emergency alert"));
  var body = el("div","abody");
  var stamp = el("div","stamp","AUSALERT \u00b7 Monday 27 July, 2pm");
  body.appendChild(stamp);
  var lineNodes = [];
  DEMO_LINES.forEach(function(l){
    var p = el("p","aline" + (l.cls? " "+l.cls : ""), l.t);
    body.appendChild(p); lineNodes.push(p);
  });
  card.appendChild(head); card.appendChild(body);
  var idle = el("div","idle","Tap Play the alert to start.");
  screen.appendChild(time); screen.appendChild(date); screen.appendChild(wave);
  screen.appendChild(card); screen.appendChild(idle);
  phone.appendChild(screen);
  phoneWrap.appendChild(phone);

  var side = el("div","");
  var controls = el("div","demo-controls");
  var playBtn = el("button","bigbtn","Play the alert"); playBtn.type="button";
  var againBtn = el("button","bigbtn ghost","Read the message again"); againBtn.type="button";
  var soundBtn = el("button","bigbtn ghost","Sound is on"); soundBtn.type="button";
  var stopBtn = el("button","bigbtn ghost","Stop the sound"); stopBtn.type="button";
  controls.appendChild(playBtn); controls.appendChild(againBtn);
  controls.appendChild(soundBtn); controls.appendChild(stopBtn);
  side.appendChild(controls);
  side.appendChild(el("div","warnline","The alert sound is loud. Turn your volume down first, or turn the sound off."));

  var tr = el("div","transcript");
  tr.appendChild(el("h3",null,"The message on the screen"));
  var msg = el("div","msg");
  DEMO_LINES.forEach(function(l){ msg.appendChild(el("p","",l.t)); });
  tr.appendChild(msg);
  var readBtn = el("button","minibtn","Listen to the message"); readBtn.type="button";
  readBtn.style.marginTop=".7rem";
  readBtn.addEventListener("click",function(){
    speak("Oz Alert. Test message. This is a test of Oz Alert, the new warning system. This is only a test. There is no danger. You do not need to do anything. In a real emergency, this message tells you about danger in your area and what to do.");
  });
  tr.appendChild(readBtn);
  tr.appendChild(makeVoiceNote());
  side.appendChild(tr);

  stage.appendChild(phoneWrap); stage.appendChild(side);
  wrap.appendChild(stage);

  function runDemo(){
    stopSound();
    card.classList.remove("show");
    lineNodes.forEach(function(p){ p.classList.remove("in"); });
    idle.style.display = "none";
    var d = playAlertTone();
    wave.classList.add("on");
    screen.classList.add("buzz");
    setTimeout(function(){ screen.classList.remove("buzz"); }, 3000);
    card.classList.add("show");
    lineNodes.forEach(function(p,i){ setTimeout(function(){ p.classList.add("in"); }, 350 + i*550); });
    setTimeout(function(){ wave.classList.remove("on"); }, (d||3)*1000);
  }
  playBtn.addEventListener("click", runDemo);
  againBtn.addEventListener("click", function(){
    card.classList.add("show"); idle.style.display="none";
    lineNodes.forEach(function(p){ p.classList.add("in"); });
  });
  soundBtn.addEventListener("click", function(){
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? "Sound is on" : "Sound is off";
    if(!soundOn) stopSound();
  });
  stopBtn.addEventListener("click", stopSound);
  return wrap;
}

/* =========================================================
   BUILD SECTIONS
   ========================================================= */
function buildAll(){
  var host = document.getElementById("sections");
  SECTIONS.forEach(function(sec){
    var s = el("section","act"); s.id = sec.id;
    var h = el("h2","");
    h.appendChild(el("span","snum",sec.num));
    h.appendChild(el("span","",sec.title));
    s.appendChild(h);
    var body = el("div","sbody");
    var note = el("div","focus-note");
    note.appendChild(el("b",null,"What to do: "));
    note.appendChild(document.createTextNode(sec.focus));
    body.appendChild(note);
    if(sec.demo){ body.appendChild(buildDemo()); }
    if(sec.id === "s8"){ body.appendChild(makeVoiceNote()); }

    var n = 1;
    sec.items.forEach(function(item){
      var node;
      if(item.type==="mc"){ node = renderMC(item, n, sec.id); n+=1; }
      else if(item.type==="tf"){ node = renderTF(item, n, sec.id); n+=1; }
      else if(item.type==="type"){ node = renderType(item, n, sec.id); n+=1; }
      else if(item.type==="build"){ node = renderBuild(item, n, sec.id); n+=1; }
      else if(item.type==="listen"){ node = renderListen(item, n, sec.id); n+=1; }
      else if(item.type==="match"){ node = renderMatch(item, n, sec.id); n+=item.pairs.length; }
      else if(item.type==="gapset"){ node = renderGapset(item, n, sec.id); n+=item.lines.length; }
      else if(item.type==="order"){ node = renderOrder(item, n, sec.id); n+=item.correct.length; }
      else if(item.type==="sort"){ node = renderSort(item, n, sec.id); n+=item.rows.length; }
      if(node) body.appendChild(node);
    });
    s.appendChild(body);

    var key = el("div","keybox"); key.id = "key-" + sec.id;
    key.appendChild(el("h3",null,"Answer key: Section " + sec.num));
    var ol = document.createElement("ol");
    REG.filter(function(r){return r.sec===sec.id;}).forEach(function(r){
      var li = document.createElement("li");
      li.textContent = r.ans;
      li.value = r.n;
      ol.appendChild(li);
    });
    key.appendChild(ol);
    s.appendChild(key);

    var foot = el("div","sfoot");
    var chk = el("button","bigbtn","Check this section"); chk.type="button";
    var keyBtn = el("button","bigbtn ghost","Show the answer key"); keyBtn.type="button";
    var again = el("button","bigbtn ghost","Do it again"); again.type="button";
    var sc = el("span","score","");
    chk.addEventListener("click",function(){
      var list = REG.filter(function(r){return r.sec===sec.id;});
      var got = 0;
      list.forEach(function(r){ if(r.check()) got++; });
      sc.textContent = "Score: " + got + " out of " + list.length;
      updateTotal();
    });
    keyBtn.addEventListener("click",function(){
      key.classList.toggle("show");
      keyBtn.textContent = key.classList.contains("show") ? "Hide the answer key" : "Show the answer key";
      if(key.classList.contains("show")){
        REG.filter(function(r){return r.sec===sec.id;}).forEach(function(r){ r.reveal(); });
      }
    });
    again.addEventListener("click",function(){
      REG.filter(function(r){return r.sec===sec.id;}).forEach(function(r){ r.reset(); });
      sc.textContent=""; key.classList.remove("show"); keyBtn.textContent="Show the answer key";
      updateTotal();
    });
    foot.appendChild(chk); foot.appendChild(keyBtn); foot.appendChild(again); foot.appendChild(sc);
    s.appendChild(foot);
    host.appendChild(s);
  });
}

function buildFinalKey(){
  var host = document.getElementById("finalkey");
  host.appendChild(el("h2",null,"VU23520: AusAlert Revision: full answer key"));
  SECTIONS.forEach(function(sec){
    host.appendChild(el("h3",null,"Section " + sec.num + ": " + sec.title));
    var ol = document.createElement("ol");
    REG.filter(function(r){return r.sec===sec.id;}).forEach(function(r){
      var li=document.createElement("li"); li.value=r.n; li.textContent=r.ans; ol.appendChild(li);
    });
    host.appendChild(ol);
  });
}

function updateTotal(){
  var answered=0;
  REG.forEach(function(r){ if(r.answered()) answered++; });
  if(answered===0){ document.getElementById("result").classList.remove("show"); }
}

function checkEverything(){
  var got=0;
  REG.forEach(function(r){ if(r.check()) got++; });
  var box=document.getElementById("result");
  document.getElementById("rScore").textContent=got;
  document.getElementById("rTotal").textContent=REG.length;
  var pct=Math.round(got/REG.length*100);
  box.classList.add("show");
  setTimeout(function(){ document.getElementById("rBar").style.width = pct + "%"; }, 60);
  var msg = pct>=90 ? "Excellent work. You are ready for the next lesson."
          : pct>=70 ? "Good work. Look again at the questions in red."
          : pct>=50 ? "Nice try. Read the answer key, then do the sections again."
          : "Keep going. Do the sections again with the answer key next to you.";
  document.getElementById("rMsg").textContent = msg + " (" + pct + "%)";
  if(box.scrollIntoView) box.scrollIntoView({behavior:"smooth", block:"center"});
}

/* =========================================================
   INIT
   ========================================================= */
document.addEventListener("DOMContentLoaded", function(){
  buildAll();
  buildFinalKey();
  refreshVoiceNotes();
  setTimeout(refreshVoiceNotes, 600);

  document.querySelectorAll(".sizebtn").forEach(function(b){
    b.addEventListener("click", function(){
      document.querySelectorAll(".sizebtn").forEach(function(x){x.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed","true");
      document.documentElement.className = b.dataset.size || "";
    });
  });

  document.getElementById("checkAll").addEventListener("click", checkEverything);
  document.getElementById("showAll").addEventListener("click", function(){
    var w=document.getElementById("keywrap");
    w.classList.toggle("show");
    this.textContent = w.classList.contains("show") ? "Hide the full answer key" : "Show the full answer key";
    if(w.classList.contains("show") && w.scrollIntoView) w.scrollIntoView({behavior:"smooth", block:"start"});
  });
  document.getElementById("resetAll").addEventListener("click", function(){
    REG.forEach(function(r){ r.reset(); });
    document.querySelectorAll(".score").forEach(function(s){ s.textContent=""; });
    document.querySelectorAll(".keybox").forEach(function(k){ k.classList.remove("show"); });
    document.querySelectorAll(".sfoot .ghost").forEach(function(b){ if(b.textContent.indexOf("answer key")>-1) b.textContent="Show the answer key"; });
    document.getElementById("result").classList.remove("show");
    document.getElementById("rBar").style.width="0";
    try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){}
  });
});
</script>
